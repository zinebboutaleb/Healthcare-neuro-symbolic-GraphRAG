services:
  neo4j:
    image: neo4j:5.26-community
    container_name: healthcare-kg-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/healthcare123   # keep in sync with NEO4J_PASSWORD in .env
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p healthcare123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  neo4j_data:
